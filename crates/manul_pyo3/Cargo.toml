[package]
name = "manul_pyo3"
version.workspace = true
edition.workspace = true
description = "Python export entrypoints for the manul project."
license-file = "../../LICENSE"
repository = "https://github.com/STomoya/manul"


[lib]
name = "_manul"
crate-type = ["cdylib", "rlib"]

[dependencies]
manul_core = { workspace = true }
manul_logger = { workspace = true }
pyo3 = { workspace = true, features = ["abi3-py311"] }

[dev-dependencies]
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
